<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gym Companion</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #190133;
            --card-bg: #27064d;
            --card-border: #3e1273;
            --accent: #FF4500;
            --accent-hover: #e03d00;
            --accent-light: rgba(255, 69, 0, 0.15);
            --danger: #ff3355;
            --danger-light: rgba(255, 51, 85, 0.15);
            --text-main: #FFFFFF;
            --text-muted: #B3A5C9;
            --input-bg: #130029;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .date-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Split Selector Tabs */
        .split-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .split-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--accent);
            color: #FFF;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
        }

        /* Targeted Muscles Section */
        .target-section {
            background: linear-gradient(135deg, var(--card-bg), #1d033a);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .target-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .muscle-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid rgba(255, 69, 0, 0.3);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Exercise Cards */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Card Header Image Styling */
        .card-header-img {
            width: 100%;
            height: 160px;
            object-fit: cover;
            border-bottom: 1px solid var(--card-border);
            background-color: var(--input-bg);
            display: block;
        }

        .card-body {
            padding: 16px;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .remove-ex-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 0 4px;
            transition: color 0.2s;
        }

        .remove-ex-btn:hover {
            color: var(--danger);
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent-light);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .machine-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Sets Table Grid */
        .sets-header {
            display: grid;
            grid-template-columns: 0.5fr 1fr 1fr 0.6fr 0.4fr;
            gap: 6px;
            text-align: center;
            font-size: 0.7rem;
            text-transform: uppercase;
            color: var(--text-muted);
            font-weight: 700;
            margin-bottom: 8px;
        }

        .set-row {
            display: grid;
            grid-template-columns: 0.5fr 1fr 1fr 0.6fr 0.4fr;
            gap: 6px;
            align-items: center;
            margin-bottom: 8px;
        }

        .set-num {
            text-align: center;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
        }

        .set-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            border-radius: 8px;
            padding: 8px 4px;
            color: #FFF;
            text-align: center;
            font-size: 0.9rem;
            font-weight: 700;
            outline: none;
        }

        .set-input:focus {
            border-color: var(--accent);
        }

        .check-btn {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            border-radius: 8px;
            padding: 8px 0;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .check-btn.done {
            background: var(--accent);
            color: #FFF;
            border-color: var(--accent);
        }

        .delete-set-btn {
            background: transparent;
            border: none;
            color: #776590;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            padding: 6px 0;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: color 0.2s;
        }

        .delete-set-btn:hover {
            color: var(--danger);
        }

        .add-set-btn {
            width: 100%;
            background: transparent;
            border: 1px dashed var(--card-border);
            color: var(--text-muted);
            padding: 10px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .add-set-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .add-exercise-btn {
            background: var(--accent);
            color: #FFF;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Modal styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(19, 0, 41, 0.85);
            backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.5);
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .modal-title {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.4rem;
            cursor: pointer;
        }

        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 12px;
            border-radius: 12px;
            color: #FFF;
            font-size: 0.9rem;
            margin-bottom: 12px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .library-list {
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .library-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 12px 16px;
            border-radius: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
        }

        .library-item:hover {
            border-color: var(--accent);
        }

        .item-info h4 {
            font-size: 0.9rem;
            font-weight: 700;
        }

        .item-info p {
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>

    <div class="app-container">

        <!-- Add Exercise Button -->
        <button class="add-exercise-btn" onclick="openModal()">
            <span>+</span> Add Exercise from Library

    </div>

            { name: "Side Plank", category: "cardio", muscle: "Obliques", equipment: "Mat" },
            { name: "Cable Woodchopper", category: "cardio", muscle: "Obliques", equipment: "Cable Station" },
            { name: "Plank", category: "cardio", muscle: "Core Stability", equipment: "Mat" },
            { name: "Weighted Plank", category: "cardio", muscle: "Core Stability", equipment: "Weight Plate" },
            { name: "Ab Wheel Rollout", category: "cardio", muscle: "Core", equipment: "Ab Roller" },
            { name: "Farmer's Walk", category: "cardio", muscle: "Grip, Core", equipment: "Heavy Dumbbells" }
        ];

        // Initial Workout State
        let workouts = {
            push: [
                createExerciseObject("Incline Dumbbell Press", "Upper Chest", "Incline Bench & Dumbbells"),
                createExerciseObject("Dumbbell Lateral Raise", "Side Delts", "Dumbbells"),
                createExerciseObject("Triceps Pushdown", "Triceps", "Cable Machine")
            ],
            pull: [
                createExerciseObject("Lat Pulldown", "Lats", "Lat Pulldown Station"),
                createExerciseObject("Seated Cable Row", "Mid Back", "Seated Row Machine"),
                createExerciseObject("Barbell Curl", "Biceps", "Barbell")
            ],
            legs: [
                createExerciseObject("Barbell Squat", "Quads, Glutes", "Squat Rack & Barbell"),
                createExerciseObject("Seated Leg Curl", "Hamstrings", "Seated Leg Curl Machine"),
                createExerciseObject("Standing Calf Raise", "Calves", "Calf Machine")
            ],
            cardio: [
                createExerciseObject("Incline Walking", "Cardio", "Treadmill"),
                createExerciseObject("Hanging Leg Raises", "Lower Abs", "Pull-up Bar"),
                createExerciseObject("Plank", "Core Stability", "Mat")
            ]
        };

        let currentDay = 'push';

        // Helper function to create an exercise object with image placeholder
        function createExerciseObject(name, muscle, equipment, customImage) {
            // YOU CAN REPLACE THIS PLACEHOLDER URL WITH YOUR OWN IMAGE LINK OR PATH
            const placeholder = `https://placehold.co/600x300/27064d/FF4500?text=${encodeURIComponent(name)}`;
            
            return {
                id: 'ex_' + Math.random().toString(36).substr(2, 9),
                name: name,
                muscle: muscle,
                machine: equipment,
                image: customImage || placeholder,
                yt: `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' form tutorial')}`,
                sets: [
                    { weight: 20, reps: 10, done: false },
                    { weight: 20, reps: 10, done: false }
                ]
            };
        }

        function loadState() {
            const saved = localStorage.getItem('gym_pulse_v3_data');
            if (saved) {
                workouts = JSON.parse(saved);
            }
        }

        function saveState() {
            localStorage.setItem('gym_pulse_v3_data', JSON.stringify(workouts));
        }

        function setDate() {
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);
        }

        function render() {
            const currentExercises = workouts[currentDay] || [];
            
            // Render Dynamic Targeted Muscle Tags
            const muscles = [...new Set(currentExercises.map(ex => ex.muscle).flatMap(m => m.split(', ')))];
            const muscleTagsContainer = document.getElementById('muscleTags');
            muscleTagsContainer.innerHTML = muscles.length > 0 
                ? muscles.map(m => `<span class="tag">${m}</span>`).join('')
                : '<span style="color:var(--text-muted); font-size:0.8rem;">No exercises added yet</span>';

            // Render Exercises Cards (with Card Image header)
            const listContainer = document.getElementById('exerciseList');
            listContainer.innerHTML = currentExercises.map((ex, exIdx) => `
                <div class="card">
                    <!-- EXERCISE IMAGE PLACEHOLDER -->
                    <img src="${ex.image}" alt="${ex.name}" class="card-header-img" loading="lazy">
                    
                    <div class="card-body">
                        <div class="card-title-row">
                            <h2 class="card-title">${ex.name}</h2>
                            <button class="remove-ex-btn" title="Delete Exercise" onclick="removeExercise(${exIdx})">&times;</button>
                        </div>
                        
                        <div class="card-actions">
                            <div class="machine-info">🎯 ${ex.machine}</div>
                            <a href="${ex.yt}" target="_blank" rel="noopener" class="yt-link">
                                <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 .61-.03 1.3-.1 2.1-.06.79-.15 1.43-.28 1.9-.13.47-.33.91-.6 1.3-.27.38-.63.67-1.08.86-.45.19-1.02.32-1.72.39-.7.07-1.58.1-2.65.1L12 18.75c-3.57 0-5.83-.07-6.78-.2-.95-.12-1.63-.3-2.05-.53-.42-.23-.76-.55-1.02-.95-.26-.4-.44-.86-.55-1.39-.11-.53-.18-1.21-.22-2.04C2.01 12.81 2 12.21 2 12.01s.01-.8.04-1.63c.04-.83.11-1.51.22-2.04.11-.53.29-.99.55-1.39.26-.4.6-.72 1.02-.95.42-.23 1.1-.41 2.05-.53C6.83 5.34 9.09 5.27 12.66 5.27l3.57.08c1.07 0 1.95.03 2.65.1.7.07 1.27.2 1.72.39.45.19.81.48 1.08.86.27.39.47.83.6 1.3z"/></svg>
                                Watch Guide
                            </a>
                        </div>

                        <!-- Sets Table Grid -->
                        <div class="sets-header">
                            <span>Set</span>
                            <span>Weight</span>
                            <span>Reps</span>
                            <span>Done</span>
                            <span></span>
                        </div>
                        <div>
                            ${ex.sets.map((set, setIdx) => `
                                <div class="set-row">
                                    <span class="set-num">${setIdx + 1}</span>
                                    <input type="number" class="set-input" value="${set.weight}" 
                                        onchange="updateSet(${exIdx}, ${setIdx}, 'weight', this.value)">
                                    <input type="number" class="set-input" value="${set.reps}" 
                                        onchange="updateSet(${exIdx}, ${setIdx}, 'reps', this.value)">
                                    <button class="check-btn ${set.done ? 'done' : ''}" 
                                        onclick="toggleDone(${exIdx}, ${setIdx})">✓</button>
                                    <button class="delete-set-btn" title="Remove Set" onclick="removeSet(${exIdx}, ${setIdx})">&times;</button>
                                </div>
                            `).join('')}
                        </div>
                        <button class="add-set-btn" onclick="addSet(${exIdx})">+ Add Set</button>
                    </div>
                </div>
            `).join('');
        }

        /* UI Handlers */
        function switchDay(day) {
            currentDay = day;
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(day));
            });
            render();
        }

        function updateSet(exIdx, setIdx, field, value) {
            workouts[currentDay][exIdx].sets[setIdx][field] = parseFloat(value) || 0;
            saveState();
        }

        function toggleDone(exIdx, setIdx) {
            const status = workouts[currentDay][exIdx].sets[setIdx].done;
            workouts[currentDay][exIdx].sets[setIdx].done = !status;
            saveState();
            render();
        }

        function addSet(exIdx) {
            const sets = workouts[currentDay][exIdx].sets;
            const lastSet = sets[sets.length - 1] || { weight: 0, reps: 0 };
            sets.push({ weight: lastSet.weight, reps: lastSet.reps, done: false });
            saveState();
            render();
        }

        function removeSet(exIdx, setIdx) {
            workouts[currentDay][exIdx].sets.splice(setIdx, 1);
            saveState();
            render();
        }

        function removeExercise(exIdx) {
            workouts[currentDay].splice(exIdx, 1);
            saveState();
            render();
        }

        /* Modal & Library Logic */
        function openModal() {
            document.getElementById('libraryModal').classList.add('active');
            renderLibrary(EXERCISE_LIBRARY);
        }

        function closeModal() {
            document.getElementById('libraryModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        function renderLibrary(items) {
            const container = document.getElementById('libraryList');
            container.innerHTML = items.map(item => `
                <div class="library-item" onclick="selectFromLibrary('${item.name.replace(/'/g, "\\'")}', '${item.muscle}', '${item.equipment}')">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.muscle} • ${item.equipment}</p>
                    </div>
                    <span style="color:var(--accent); font-weight:bold; font-size:1.2rem;">+</span>
                </div>
            `).join('');
        }

        function filterLibrary() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = EXERCISE_LIBRARY.filter(ex => 
                ex.name.toLowerCase().includes(query) || 
                ex.muscle.toLowerCase().includes(query)
            );
            renderLibrary(filtered);
        }

        function selectFromLibrary(name, muscle, equipment) {
            const newEx = createExerciseObject(name, muscle, equipment);
            workouts[currentDay].push(newEx);
            saveState();
            render();
            closeModal();
        }

        // Init App
        setDate();
        loadState();
        render();
    </script>
</body>
</html>
