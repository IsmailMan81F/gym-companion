<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Gym Pulse</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #190133;
            --card-bg: #27064d;
            --card-border: #3e1273;
            --accent: #FF4500;
            --accent-hover: #e03d00;
            --accent-light: rgba(255, 69, 0, 0.15);
            --danger: #ff3355;
            --danger-light: rgba(255, 51, 85, 0.15);
            --text-main: #FFFFFF;
            --text-muted: #B3A5C9;
            --input-bg: #130029;
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        /* Prevent scrolling on body when modal is open */
        body.modal-open {
            overflow: hidden !important;
            height: 100vh !important;
            touch-action: none !important;
            overscroll-behavior: none !important;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding: 0;
            margin: 0;
        }

        .app-container {
            width: 100%;
            max-width: 480px;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding-bottom: 60px;
        }

        /* Header */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
        }

        header h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(90deg, #FFFFFF, var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .date-badge {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        /* Split Selector Tabs */
        .split-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 8px;
            scrollbar-width: none;
        }

        .split-nav::-webkit-scrollbar {
            display: none;
        }

        .nav-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 10px 18px;
            border-radius: 25px;
            font-weight: 700;
            font-size: 0.85rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-btn.active {
            background: var(--accent);
            color: #FFF;
            border-color: var(--accent);
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.4);
        }

        /* Muscle Group Filter */
        .muscle-filter-nav {
            display: flex;
            flex-wrap: nowrap;
            overflow-x: auto;
            gap: 8px;
            scrollbar-width: none;
        }

        .muscle-filter-nav::-webkit-scrollbar {
            display: none;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            padding: 8px 14px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.78rem;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .filter-btn.active {
            background: var(--accent-light);
            color: var(--accent);
            border-color: rgba(255, 69, 0, 0.5);
        }

        /* Targeted Muscles Section */
        .target-section {
            background: linear-gradient(135deg, var(--card-bg), #1d033a);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 16px;
        }

        .target-section h3 {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        .muscle-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .tag {
            background: var(--accent-light);
            color: var(--accent);
            border: 1px solid rgba(255, 69, 0, 0.3);
            padding: 6px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        /* Exercise Cards */
        .exercise-list {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Card Header Image Styling */
        .card-header-img-wrapper {
            position: relative;
            width: 100%;
            height: 180px;
            overflow: hidden;
            background-color: var(--input-bg);
        }

        .card-header-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.3s ease;
        }

        .card:hover .card-header-img {
            transform: scale(1.03);
        }

        .card-body {
            padding: 16px;
        }

        .card-title-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
            gap: 10px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .remove-ex-btn {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            font-size: 1.4rem;
            line-height: 1;
            cursor: pointer;
            width: 36px;
            height: 36px;
            min-width: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.2s, background 0.2s, border-color 0.2s;
        }

        .remove-ex-btn:hover {
            color: var(--danger);
            background: var(--danger-light);
            border-color: rgba(255, 51, 85, 0.4);
        }

        .card-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .yt-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.75rem;
            font-weight: 700;
            background: var(--accent-light);
            padding: 6px 10px;
            border-radius: 8px;
        }

        .machine-info {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .add-exercise-btn {
            background: var(--accent);
            color: #FFF;
            border: none;
            border-radius: var(--radius);
            padding: 14px;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(255, 69, 0, 0.3);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        /* Set Default Exercises Button */
        .default-exercise-btn {
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .default-exercise-btn:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: rgba(255, 69, 0, 0.05);
        }

        /* Clear Exercise List Button */
        .clear-list-btn {
            background: transparent;
            color: var(--danger);
            border: 1px solid var(--card-border);
            border-radius: var(--radius);
            padding: 14px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .clear-list-btn:hover {
            border-color: var(--danger);
            background: var(--danger-light);
        }

        /* Fixed Strict Modal Styling */
        .modal-overlay {
            position: fixed;
            top: 0; 
            left: 0; 
            right: 0; 
            bottom: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 0, 25, 0.88);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 99999;
            touch-action: none;
            pointer-events: auto;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-content {
            background: var(--card-bg);
            border-top: 1px solid var(--card-border);
            border-radius: 24px 24px 0 0;
            width: 100%;
            max-width: 480px;
            height: 82vh;
            display: flex;
            flex-direction: column;
            padding: 20px 18px;
            box-shadow: 0 -10px 40px rgba(0,0,0,0.8);
            animation: slideUp 0.25s ease-out;
            position: relative;
            touch-action: auto;
        }

        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            flex-shrink: 0;
        }

        .modal-title {
            font-size: 1.15rem;
            font-weight: 800;
        }

        .close-modal {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--card-border);
            color: var(--text-muted);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 1.2rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-input {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 12px 14px;
            border-radius: 12px;
            color: #FFF;
            font-size: 0.9rem;
            margin-bottom: 14px;
            outline: none;
            flex-shrink: 0;
        }

        .search-input:focus {
            border-color: var(--accent);
        }

        .library-list {
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding-bottom: 20px;
            touch-action: pan-y;
        }

        .library-item {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 10px 14px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
        }

        .library-item:hover {
            border-color: var(--accent);
            background: rgba(255, 69, 0, 0.05);
        }

        .library-item-img {
            width: 52px;
            height: 52px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--card-bg);
        }

        .item-info {
            flex: 1;
        }

        .item-info h4 {
            font-size: 0.88rem;
            font-weight: 700;
            color: #FFF;
            margin-bottom: 2px;
        }

        .item-info p {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        .add-icon-btn {
            color: var(--accent);
            font-weight: 800;
            font-size: 1.3rem;
            padding: 0 4px;
        }

        .icon {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <header>
            <h1>GYM PULSE</h1>
            <div class="date-badge" id="currentDate">Today</div>
        </header>

        <!-- Split Selector Navigation -->
        <div class="split-nav">
            <button class="nav-btn active" onclick="switchDay('push')">Push Day</button>
            <button class="nav-btn" onclick="switchDay('pull')">Pull Day</button>
            <button class="nav-btn" onclick="switchDay('legs')">Legs Day</button>
        </div>

        <!-- Muscle Group Filter -->
        <div class="muscle-filter-nav" id="muscleFilterNav"></div>

        <!-- Targeted Muscles -->
        <div class="target-section">
            <h3>Targeted Muscle Groups</h3>
            <div class="muscle-tags" id="muscleTags"></div>
        </div>

        <!-- Exercises List -->
        <div class="exercise-list" id="exerciseList"></div>

        <!-- Add Exercise Button -->
        <button class="add-exercise-btn" onclick="openModal()">
            <span>+</span> Add Exercise from Library
        </button>

        <!-- Set Default Exercises Button -->
        <button class="default-exercise-btn" onclick="setDefaultExercises()">
            ⚡ Set Default Exercises
        </button>

        <!-- Clear List Button -->
        <button class="clear-list-btn" onclick="clearList()">
            🗑️ Clear List
        </button>
    </div>

    <!-- Library Modal -->
    <div class="modal-overlay" id="libraryModal">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h3 class="modal-title">Exercise Library</h3>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>
            <input type="text" id="searchInput" class="search-input" placeholder="Search exercise or muscle..." onkeyup="filterLibrary()">
            <div class="library-list" id="libraryList"></div>
        </div>
    </div>

    <script>
        // High Quality Real Image Resolver Function
        function getImageForExercise(name, category, muscle) {
            const n = name.toLowerCase();
            const m = muscle.toLowerCase();

            if (n.includes('bench press') || n.includes('chest press') || n.includes('barbell bench')) 
                return 'https://images.unsplash.com/photo-1571019614242-c5c5dee9f50b?auto=format&fit=crop&w=800&q=80';
            if (m.includes('biceps') || n.includes('curl')) 
                return 'https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?auto=format&fit=crop&w=800&q=80';
            if (m.includes('triceps') || n.includes('pushdown') || n.includes('skull') || n.includes('kickback') || n.includes('triceps extension')) 
                return 'https://images.unsplash.com/photo-1530822847156-5df684611749?auto=format&fit=crop&w=800&q=80';
            if (n.includes('incline') || n.includes('fly') || n.includes('crossover') || n.includes('pec deck')) 
                return 'https://images.unsplash.com/photo-1581009146145-b5ef050c2e1e?auto=format&fit=crop&w=800&q=80';
            if (n.includes('dip') || n.includes('push-up') || n.includes('pushup')) 
                return 'https://images.unsplash.com/photo-1598971639058-fab3c3109a00?auto=format&fit=crop&w=800&q=80';
            if (n.includes('shoulder') || n.includes('overhead') || n.includes('military') || n.includes('arnold') || n.includes('landmine')) 
                return 'https://images.unsplash.com/photo-1541534741688-6078c6bfb5c5?auto=format&fit=crop&w=800&q=80';
            if (n.includes('lateral') || n.includes('front raise') || n.includes('delt') || n.includes('upright row') || n.includes('face pull') || n.includes('shrug')) 
                return 'https://images.unsplash.com/photo-1583454110551-21f2fa2afe61?auto=format&fit=crop&w=800&q=80';
            if (n.includes('pull-up') || n.includes('pull up') || n.includes('chin-up') || n.includes('pulldown')) 
                return 'https://images.unsplash.com/photo-1605296867304-46d5465a13f1?auto=format&fit=crop&w=800&q=80';
            if (n.includes('row')) 
                return 'https://images.unsplash.com/photo-1603287681836-b174ce5074c2?auto=format&fit=crop&w=800&q=80';
            if (n.includes('deadlift') || n.includes('good morning') || n.includes('back extension') || n.includes('rack pull')) 
                return 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80';
            if (n.includes('squat') || n.includes('leg press') || n.includes('step up')) 
                return 'https://images.unsplash.com/photo-1574680096145-d05b474e2155?auto=format&fit=crop&w=800&q=80';
            if (n.includes('lunge') || n.includes('split squat')) 
                return 'https://images.unsplash.com/photo-1434682881908-b43d0467b798?auto=format&fit=crop&w=800&q=80';
            if (n.includes('leg extension') || n.includes('leg curl')) 
                return 'https://images.unsplash.com/photo-1534438327276-14e5300c3a48?auto=format&fit=crop&w=800&q=80';
            if (n.includes('calf') || n.includes('thrust') || n.includes('glute')) 
                return 'https://images.unsplash.com/photo-1532029837206-abbe2b7620e3?auto=format&fit=crop&w=800&q=80';
            if (n.includes('run') || n.includes('treadmill') || n.includes('walk') || n.includes('stair') || n.includes('elliptical') || n.includes('hiit') || n.includes('jump rope')) 
                return 'https://images.unsplash.com/photo-1538805060514-97d9cc17730c?auto=format&fit=crop&w=800&q=80';
            if (n.includes('bike') || n.includes('cycling')) 
                return 'https://images.unsplash.com/photo-1517649763962-0c623266ddc0?auto=format&fit=crop&w=800&q=80';
            if (n.includes('rowing')) 
                return 'https://images.unsplash.com/photo-1519505907962-0a6cb0167c73?auto=format&fit=crop&w=800&q=80';
            if (category === 'cardio' || m.includes('abs') || m.includes('core') || n.includes('plank') || n.includes('crunch') || n.includes('v-up') || n.includes('twist') || n.includes('woodchopper')) 
                return 'https://images.unsplash.com/photo-1571019613454-1cb2f99b2d8b?auto=format&fit=crop&w=800&q=80';

            return 'https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80';
        }

        // MASTER EXERCISE LIBRARY DYNAMIC DATA
        const EXERCISE_LIBRARY = [
            // PUSH — Top Chest Exercises
            { name: "Barbell Bench Press", category: "push", muscle: "Chest", equipment: "Barbell & Bench", group: "Chest" },
            { name: "Dumbbell Bench Press", category: "push", muscle: "Chest", equipment: "Flat Bench & Dumbbells", group: "Chest" },
            { name: "Incline Press", category: "push", muscle: "Upper Chest", equipment: "Incline Bench & Barbell/Dumbbells", group: "Chest" },
            { name: "Chest Dips", category: "push", muscle: "Lower Chest, Front Shoulders", equipment: "Dip Bars", group: "Chest" },
            { name: "Cable Flyes", category: "push", muscle: "Chest", equipment: "Cable Machine", group: "Chest" },

            // PUSH — Top Shoulder Exercises
            { name: "Overhead Press", category: "push", muscle: "Shoulders", equipment: "Barbell / Dumbbells", group: "Shoulders" },
            { name: "Lateral Raises", category: "push", muscle: "Side Delts", equipment: "Dumbbells / Cables", group: "Shoulders" },

            // PUSH — Top Tricep Exercises
            { name: "Tricep Pushdowns", category: "push", muscle: "Triceps", equipment: "Cable Machine & Rope/Bar", group: "Triceps" },
            { name: "Overhead Triceps Extension", category: "push", muscle: "Triceps", equipment: "Cable / Dumbbell", group: "Triceps" },
            { name: "Skull Crushers", category: "push", muscle: "Triceps", equipment: "EZ Bar / Dumbbells", group: "Triceps" },

            // PULL — Top Back Exercises
            { name: "Deadlifts", category: "pull", muscle: "Lower Back, Traps, Lats", equipment: "Barbell", group: "Back" },
            { name: "Pull-Ups or Lat Pulldowns", category: "pull", muscle: "Lats, Back Width", equipment: "Pull-up Bar / Lat Pulldown Station", group: "Back" },
            { name: "Bent-Over Barbell Rows", category: "pull", muscle: "Back Thickness, Mid-Back", equipment: "Barbell", group: "Back" },
            { name: "Seated Cable Rows", category: "pull", muscle: "Lats, Rhomboids", equipment: "Seated Row Machine", group: "Back" },

            // PULL — Top Bicep Exercises
            { name: "Barbell Curls", category: "pull", muscle: "Biceps", equipment: "Barbell", group: "Biceps" },
            { name: "Hammer Curls", category: "pull", muscle: "Biceps, Brachialis", equipment: "Dumbbells", group: "Biceps" },
            { name: "Incline Dumbbell Curls", category: "pull", muscle: "Biceps (Long Head)", equipment: "Incline Bench & Dumbbells", group: "Biceps" },

            // PULL — Top Rear Shoulder & Trap Exercises
            { name: "Face Pulls", category: "pull", muscle: "Rear Delts, Upper Back, Rotator Cuffs", equipment: "Cable & Rope", group: "Rear Delts & Traps" },
            { name: "Dumbbell Shrugs", category: "pull", muscle: "Upper Traps", equipment: "Dumbbells", group: "Rear Delts & Traps" },

            // LEGS — Top Quad & Glute Exercises
            { name: "Barbell Back Squats", category: "legs", muscle: "Quads, Glutes", equipment: "Squat Rack & Barbell", group: "Quads & Glutes" },
            { name: "Leg Press", category: "legs", muscle: "Quads, Glutes", equipment: "Leg Press Machine", group: "Quads & Glutes" },
            { name: "Bulgarian Split Squats", category: "legs", muscle: "Quads, Glutes", equipment: "Bench & Dumbbells", group: "Quads & Glutes" },
            { name: "Walking Lunges", category: "legs", muscle: "Quads, Glutes", equipment: "Dumbbells", group: "Quads & Glutes" },

            // LEGS — Top Hamstring & Glute Exercises
            { name: "Romanian Deadlifts (RDLs)", category: "legs", muscle: "Hamstrings, Glutes", equipment: "Barbell / Dumbbells", group: "Hamstrings & Glutes" },
            { name: "Lying or Seated Leg Curls", category: "legs", muscle: "Hamstrings", equipment: "Leg Curl Machine", group: "Hamstrings & Glutes" },
            { name: "Hip Thrusts", category: "legs", muscle: "Glutes", equipment: "Bench & Barbell", group: "Hamstrings & Glutes" },

            // LEGS — Top Calf Exercises
            { name: "Standing Calf Raises", category: "legs", muscle: "Calves (Gastrocnemius)", equipment: "Standing Calf Machine", group: "Calves" },
            { name: "Seated Calf Raises", category: "legs", muscle: "Calves (Soleus)", equipment: "Seated Calf Machine", group: "Calves" }
        ];

        // Attach dynamic real images to full library
        EXERCISE_LIBRARY.forEach(item => {
            item.image = getImageForExercise(item.name, item.category, item.muscle);
        });

        // Initial Workout State
        let workouts = {
            push: [
                createExerciseObject("Barbell Bench Press", "push", "Chest", "Barbell & Bench", "Chest"),
                createExerciseObject("Incline Press", "push", "Upper Chest", "Incline Bench & Barbell/Dumbbells", "Chest"),
                createExerciseObject("Chest Dips", "push", "Lower Chest, Front Shoulders", "Dip Bars", "Chest"),
                createExerciseObject("Cable Flyes", "push", "Chest", "Cable Machine", "Chest"),
                createExerciseObject("Overhead Press", "push", "Shoulders", "Barbell / Dumbbells", "Shoulders"),
                createExerciseObject("Lateral Raises", "push", "Side Delts", "Dumbbells / Cables", "Shoulders"),
                createExerciseObject("Tricep Pushdowns", "push", "Triceps", "Cable Machine & Rope/Bar", "Triceps"),
                createExerciseObject("Overhead Triceps Extension", "push", "Triceps", "Cable / Dumbbell", "Triceps"),
                createExerciseObject("Skull Crushers", "push", "Triceps", "EZ Bar / Dumbbells", "Triceps")
            ],
            pull: [
                createExerciseObject("Deadlifts", "pull", "Lower Back, Traps, Lats", "Barbell", "Back"),
                createExerciseObject("Pull-Ups or Lat Pulldowns", "pull", "Lats, Back Width", "Pull-up Bar / Lat Pulldown Station", "Back"),
                createExerciseObject("Bent-Over Barbell Rows", "pull", "Back Thickness, Mid-Back", "Barbell", "Back"),
                createExerciseObject("Seated Cable Rows", "pull", "Lats, Rhomboids", "Seated Row Machine", "Back"),
                createExerciseObject("Barbell Curls", "pull", "Biceps", "Barbell", "Biceps"),
                createExerciseObject("Hammer Curls", "pull", "Biceps, Brachialis", "Dumbbells", "Biceps"),
                createExerciseObject("Incline Dumbbell Curls", "pull", "Biceps (Long Head)", "Incline Bench & Dumbbells", "Biceps"),
                createExerciseObject("Face Pulls", "pull", "Rear Delts, Upper Back, Rotator Cuffs", "Cable & Rope", "Rear Delts & Traps"),
                createExerciseObject("Dumbbell Shrugs", "pull", "Upper Traps", "Dumbbells", "Rear Delts & Traps")
            ],
            legs: [
                createExerciseObject("Barbell Back Squats", "legs", "Quads, Glutes", "Squat Rack & Barbell", "Quads & Glutes"),
                createExerciseObject("Leg Press", "legs", "Quads, Glutes", "Leg Press Machine", "Quads & Glutes"),
                createExerciseObject("Bulgarian Split Squats", "legs", "Quads, Glutes", "Bench & Dumbbells", "Quads & Glutes"),
                createExerciseObject("Walking Lunges", "legs", "Quads, Glutes", "Dumbbells", "Quads & Glutes"),
                createExerciseObject("Romanian Deadlifts (RDLs)", "legs", "Hamstrings, Glutes", "Barbell / Dumbbells", "Hamstrings & Glutes"),
                createExerciseObject("Lying or Seated Leg Curls", "legs", "Hamstrings", "Leg Curl Machine", "Hamstrings & Glutes"),
                createExerciseObject("Hip Thrusts", "legs", "Glutes", "Bench & Barbell", "Hamstrings & Glutes"),
                createExerciseObject("Standing Calf Raises", "legs", "Calves (Gastrocnemius)", "Standing Calf Machine", "Calves"),
                createExerciseObject("Seated Calf Raises", "legs", "Calves (Soleus)", "Seated Calf Machine", "Calves")
            ]
        };

        let currentDay = 'push';
        let currentMuscleFilter = 'all';

        // Helper function to create exercise object with real high quality image
        function createExerciseObject(name, category, muscle, equipment, group) {
            const realImg = getImageForExercise(name, category, muscle);
            
            return {
                id: 'ex_' + Math.random().toString(36).substr(2, 9),
                name: name,
                category: category,
                muscle: muscle,
                machine: equipment,
                group: group || 'Other',
                image: realImg,
                yt: `https://www.youtube.com/results?search_query=${encodeURIComponent(name + ' form tutorial')}`
            };
        }

        function loadState() {
            const saved = localStorage.getItem('gym_pulse_v4_data');
            if (saved) {
                try {
                    workouts = JSON.parse(saved);
                    delete workouts.cardio; // legacy day, no longer supported
                    // Automatically upgrade older placeholder images / missing groups if existing
                    Object.keys(workouts).forEach(day => {
                        workouts[day].forEach(ex => {
                            if (!ex.image || ex.image.includes('placehold.co')) {
                                ex.image = getImageForExercise(ex.name, ex.category || day, ex.muscle || '');
                            }
                            if (!ex.group) {
                                const libMatch = EXERCISE_LIBRARY.find(item => item.name === ex.name);
                                ex.group = libMatch ? libMatch.group : 'Other';
                            }
                        });
                    });
                } catch(e) {
                    console.error("Failed to parse saved state", e);
                }
            }
        }

        function saveState() {
            localStorage.setItem('gym_pulse_v4_data', JSON.stringify(workouts));
        }

        function setDate() {
            const options = { weekday: 'short', month: 'short', day: 'numeric' };
            document.getElementById('currentDate').textContent = new Date().toLocaleDateString('en-US', options);
        }

        function render() {
            const currentExercises = workouts[currentDay] || [];

            // Pair each exercise with its real index in the array (needed once we filter the view)
            const indexed = currentExercises.map((ex, idx) => ({ ex, idx }));

            // Distinct muscle groups present in this day, used to build the filter pills
            const groupsInDay = [...new Set(currentExercises.map(ex => ex.group).filter(Boolean))];
            if (currentMuscleFilter !== 'all' && !groupsInDay.includes(currentMuscleFilter)) {
                currentMuscleFilter = 'all';
            }

            // Render Muscle Group Filter Pills
            const filterContainer = document.getElementById('muscleFilterNav');
            if (groupsInDay.length > 0) {
                filterContainer.style.display = 'flex';
                filterContainer.innerHTML = ['all', ...groupsInDay].map(g => `
                    <button class="filter-btn ${currentMuscleFilter === g ? 'active' : ''}" onclick="setMuscleFilter('${g.replace(/'/g, "\\'")}')">
                        ${g === 'all' ? 'All' : g}
                    </button>
                `).join('');
            } else {
                filterContainer.style.display = 'none';
                filterContainer.innerHTML = '';
            }

            // Apply the active muscle filter
            const visible = currentMuscleFilter === 'all'
                ? indexed
                : indexed.filter(item => item.ex.group === currentMuscleFilter);

            // Render Dynamic Targeted Muscle Tags — matches whatever is currently filtered/visible
            const muscles = [...new Set(visible.map(item => item.ex.muscle).flatMap(m => m.split(', ')))];
            const muscleTagsContainer = document.getElementById('muscleTags');
            muscleTagsContainer.innerHTML = muscles.length > 0 
                ? muscles.map(m => `<span class="tag">${m}</span>`).join('')
                : '<span style="color:var(--text-muted); font-size:0.8rem;">No exercises added yet</span>';

            // Render Exercises Cards (with Card Image header)
            const listContainer = document.getElementById('exerciseList');
            listContainer.innerHTML = visible.map(({ ex, idx: exIdx }) => `
                <div class="card">
                    <!-- EXERCISE REAL IMAGE -->
                    <div class="card-header-img-wrapper">
                        <img src="${ex.image}" alt="${ex.name}" class="card-header-img" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80'">
                    </div>
                    
                    <div class="card-body">
                        <div class="card-title-row">
                            <h2 class="card-title">${ex.name}</h2>
                            <button class="remove-ex-btn" title="Delete Exercise" onclick="removeExercise(${exIdx})">&times;</button>
                        </div>
                        
                        <div class="card-actions">
                            <div class="machine-info">🎯 ${ex.machine}</div>
                            <a href="${ex.yt}" target="_blank" rel="noopener" class="yt-link">
                                <svg class="icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10 15l5.19-3L10 9v6m11.56-7.83c.13.47.22 1.1.28 1.9.07.8.1 1.49.1 2.09L22 12c0 .61-.03 1.3-.1 2.1-.06.79-.15 1.43-.28 1.9-.13.47-.33.91-.6 1.3-.27.38-.63.67-1.08.86-.45.19-1.02.32-1.72.39-.7.07-1.58.1-2.65.1L12 18.75c-3.57 0-5.83-.07-6.78-.2-.95-.12-1.63-.3-2.05-.53-.42-.23-.76-.55-1.02-.95-.26-.4-.44-.86-.55-1.39-.11-.53-.18-1.21-.22-2.04C2.01 12.81 2 12.21 2 12.01s.01-.8.04-1.63c.04-.83.11-1.51.22-2.04.11-.53.29-.99.55-1.39.26-.4.6-.72 1.02-.95.42-.23 1.1-.41 2.05-.53C6.83 5.34 9.09 5.27 12.66 5.27l3.57.08c1.07 0 1.95.03 2.65.1.7.07 1.27.2 1.72.39.45.19.81.48 1.08.86.27.39.47.83.6 1.3z"/></svg>
                                Watch Guide
                            </a>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        /* Set the active muscle-group filter for the current day */
        function setMuscleFilter(group) {
            currentMuscleFilter = group;
            render();
        }

        /* Set Default Exercises according to active day */
        function setDefaultExercises() {
            const defaultList = EXERCISE_LIBRARY.filter(item => item.category === currentDay);
            workouts[currentDay] = defaultList.map(item => 
                createExerciseObject(item.name, item.category, item.muscle, item.equipment, item.group)
            );
            currentMuscleFilter = 'all';
            saveState();
            render();
        }

        /* Clear Exercise List according to active day */
        function clearList() {
            workouts[currentDay] = [];
            currentMuscleFilter = 'all';
            saveState();
            render();
        }

        /* UI Handlers */
        function switchDay(day) {
            currentDay = day;
            currentMuscleFilter = 'all';
            document.querySelectorAll('.nav-btn').forEach(btn => {
                btn.classList.toggle('active', btn.textContent.toLowerCase().includes(day));
            });
            render();
        }

        function removeExercise(exIdx) {
            workouts[currentDay].splice(exIdx, 1);
            saveState();
            render();
        }

        /* Modal & Library Logic with Strict Lock */
        function openModal() {
            document.body.classList.add('modal-open');
            document.getElementById('libraryModal').classList.add('active');
            renderLibrary(EXERCISE_LIBRARY);
        }

        function closeModal() {
            document.body.classList.remove('modal-open');
            document.getElementById('libraryModal').classList.remove('active');
            document.getElementById('searchInput').value = '';
        }

        // Close on background click outside modal content
        document.getElementById('libraryModal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeModal();
            }
        });

        // Block background scroll touch move events
        document.getElementById('libraryModal').addEventListener('touchmove', function(e) {
            if (!e.target.closest('.library-list')) {
                e.preventDefault();
            }
        }, { passive: false });

        function renderLibrary(items) {
            const container = document.getElementById('libraryList');
            container.innerHTML = items.map(item => `
                <div class="library-item" onclick="selectFromLibrary('${item.name.replace(/'/g, "\\'")}', '${item.category}', '${item.muscle.replace(/'/g, "\\'")}', '${item.equipment.replace(/'/g, "\\'")}', '${(item.group || 'Other').replace(/'/g, "\\'")}')">
                    <img src="${item.image}" class="library-item-img" alt="${item.name}" loading="lazy" onerror="this.src='https://images.unsplash.com/photo-1517838277536-f5f99be501cd?auto=format&fit=crop&w=800&q=80'">
                    <div class="item-info">
                        <h4>${item.name}</h4>
                        <p>${item.muscle} • ${item.equipment}</p>
                    </div>
                    <span class="add-icon-btn">+</span>
                </div>
            `).join('');
        }

        function filterLibrary() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = EXERCISE_LIBRARY.filter(ex => 
                ex.name.toLowerCase().includes(query) || 
                ex.muscle.toLowerCase().includes(query) ||
                ex.equipment.toLowerCase().includes(query)
            );
            renderLibrary(filtered);
        }

        function selectFromLibrary(name, category, muscle, equipment, group) {
            const newEx = createExerciseObject(name, category || currentDay, muscle, equipment, group);
            workouts[currentDay].push(newEx);
            saveState();
            render();
            closeModal();
        }

        // Init App
        setDate();
        loadState();
        render();
    </script>
</body>
</html>
